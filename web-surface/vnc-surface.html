<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cage VNC Surface</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      #stage > div {
        width: 100% !important;
        height: 100% !important;
      }
      .remote-text-input {
        position: fixed;
        left: 0;
        top: 0;
        width: 2px;
        height: 20px;
        opacity: 0;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        color: transparent;
        caret-color: transparent;
        resize: none;
        outline: none;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/assets/vnc-surface.js"></script>
  </body>
</html>
