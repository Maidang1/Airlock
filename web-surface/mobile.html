<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude Code · Cage</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .session { border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      .muted { opacity: 0.7; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Cage 移动会话</strong>
      <button id="refresh" type="button">刷新</button>
    </header>
    <div id="status" class="muted">正在读取会话…</div>
    <div id="list"></div>
    <script type="module" src="/assets/mobile.js"></script>
  </body>
</html>
